services:
  github-bkp:
    build: .
    image: github-bkp-system:latest
    container_name: github-bkp
    env_file: .env
    init: true
    ports:
      # BIND_ADDR / HOST_PORT come from .env. The web UI has no authentication: use 127.0.0.1,
      # a LAN/VPN address, or 0.0.0.0 only on a network you trust (never the open internet).
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8808}:8080"
    volumes:
      - bkp-data:/data
    restart: unless-stopped

volumes:
  # External: compose never creates or deletes it, so `docker compose down -v`, image
  # rebuilds and moving this folder can't lose the backups. Create it once:
  #   docker volume create github-bkp-data
  bkp-data:
    external: true
    name: github-bkp-data
