services:
  github-bkp:
    build: .
    image: github-bkp-system:latest
    container_name: github-bkp
    env_file: .env
    init: true
    ports:
      # Web UI has no authentication: keep it on localhost or a LAN/VPN address only.
      - "127.0.0.1:8808:8080"
    volumes:
      - bkp-data:/data
    restart: unless-stopped

volumes:
  # External: compose never creates or deletes it, so `docker compose down -v`, image
  # rebuilds and moving this folder can't lose the backups. Create it once:
  #   docker volume create github-bkp-data
  bkp-data:
    external: true
    name: github-bkp-data
