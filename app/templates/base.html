<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Backups{% endblock %} | github-bkp</title>
  <script>
    // Same theme rule as the Archify architecture page, so both stay in sync.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("archify-theme"); } catch (_) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    /* Archify "signal-flow" palette. */
    :root, :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #030711;
      --surface: rgba(6, 14, 28, 0.78);
      --field: rgba(3, 7, 17, 0.7);
      --ink: #f5fbff;
      --muted: #9eb0c7;
      --rule: #1d3350;
      --accent: #67e8f9;
      --accent-ink: #030711;
      --ok: #5eead4;
      --warn: #fcd34d;
      --bad: #fda4af;
      --idle: #7890ad;
      --cell-none: #15233a;
      --glow: rgba(34, 211, 238, 0.14);
      --glow-2: rgba(139, 92, 246, 0.12);
    }
    :root[data-theme="light"] {
      color-scheme: light;
      --paper: #f4f9fc;
      --surface: rgba(255, 255, 255, 0.82);
      --field: #ffffff;
      --ink: #102638;
      --muted: #587287;
      --rule: #bfd5e2;
      --accent: #0789a1;
      --accent-ink: #ffffff;
      --ok: #087f69;
      --warn: #b9670b;
      --bad: #c53a59;
      --idle: #8aa2b4;
      --cell-none: #d4e5ee;
      --glow: rgba(6, 182, 212, 0.12);
      --glow-2: rgba(139, 92, 246, 0.08);
    }
    :root {
      --sans: "Segoe UI Variable Text", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --display: "Segoe UI Variable Display", "SF Pro Display", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font: 15px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(circle at 18% -8%, var(--glow), transparent 34rem),
        radial-gradient(circle at 92% 18%, var(--glow-2), transparent 30rem);
      background-attachment: fixed;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

    .shell { max-width: 1040px; margin: 0 auto; padding: 0 24px 64px; }
    .topbar {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      padding: 20px 0; margin-bottom: 40px; border-bottom: 1px solid var(--rule);
    }
    .brand { font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
    .topbar nav { display: flex; gap: 20px; }
    .topbar nav a { color: var(--muted); text-decoration: none; padding-bottom: 4px; border-bottom: 2px solid transparent; }
    .topbar nav a:hover { color: var(--ink); }
    .topbar nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

    h1 {
      font: 600 clamp(1.9rem, 4.2vw, 2.9rem)/1.1 var(--display);
      letter-spacing: -0.025em;
      margin: 0 0 12px;
      max-width: 22ch;
      text-wrap: balance;
    }
    .tone-bad { color: var(--bad); }
    .tone-warn { color: var(--warn); }
    .lede { color: var(--muted); margin: 0 0 32px; }

    button, .button {
      font: 500 14px/1 var(--sans);
      padding: 11px 16px;
      border-radius: 8px;
      border: 1px solid var(--rule);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button.primary { box-shadow: 0 0 20px var(--glow); }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { color: var(--muted); cursor: progress; }
    button.quiet {
      border: 0; background: none; padding: 6px 0; color: var(--muted);
      text-decoration: underline; text-underline-offset: 3px;
    }
    button.quiet:hover { color: var(--bad); }

    .mono { font-family: var(--mono); font-size: 0.93em; letter-spacing: -0.01em; }
    .muted { color: var(--muted); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">github-bkp</a>
      <nav aria-label="Principal">
        <a href="/" {% if active == "repos" %}aria-current="page"{% endif %}>Repositórios</a>
        <a href="/runs" {% if active == "runs" %}aria-current="page"{% endif %}>Execuções</a>
        <a href="/painel" {% if active == "dashboard" %}aria-current="page"{% endif %}>Painel</a>
        <a href="/arquitetura" {% if active == "architecture" %}aria-current="page"{% endif %}>Arquitetura</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
