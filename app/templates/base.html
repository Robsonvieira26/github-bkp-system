<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Backups{% endblock %} | github-bkp</title>
  <style>
    :root {
      --paper: #eef1f4;
      --surface: #ffffff;
      --ink: #17212b;
      --muted: #5b6875;
      --rule: #cdd5dd;
      --accent: #24557a;
      --accent-ink: #ffffff;
      --ok: #2e7d5b;
      --warn: #a96a12;
      --bad: #b42335;
      --idle: #8a96a3;
      --cell-none: #dde3e9;
      --sans: "Segoe UI Variable Text", "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --display: "Segoe UI Variable Display", "SF Pro Display", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #121b25;
        --surface: #1a2532;
        --ink: #e6ecf2;
        --muted: #93a1af;
        --rule: #2a3746;
        --accent: #7fb2da;
        --accent-ink: #0f1822;
        --ok: #4fb386;
        --warn: #e0a84a;
        --bad: #f06a78;
        --idle: #6f7d8b;
        --cell-none: #223040;
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      font: 15px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

    .shell { max-width: 1040px; margin: 0 auto; padding: 0 24px 64px; }
    .topbar {
      display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
      padding: 20px 0; margin-bottom: 40px; border-bottom: 1px solid var(--rule);
    }
    .brand { font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
    .topbar nav { display: flex; gap: 20px; }
    .topbar nav a { color: var(--muted); text-decoration: none; padding-bottom: 4px; border-bottom: 2px solid transparent; }
    .topbar nav a:hover { color: var(--ink); }
    .topbar nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

    h1 {
      font: 600 clamp(1.9rem, 4.2vw, 2.9rem)/1.1 var(--display);
      letter-spacing: -0.025em;
      margin: 0 0 12px;
      max-width: 22ch;
      text-wrap: balance;
    }
    .tone-bad { color: var(--bad); }
    .tone-warn { color: var(--warn); }
    .lede { color: var(--muted); margin: 0 0 32px; }

    button, .button {
      font: 500 14px/1 var(--sans);
      padding: 11px 16px;
      border-radius: 8px;
      border: 1px solid var(--rule);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button.primary:hover:not(:disabled) { filter: brightness(1.08); }
    button:disabled { color: var(--muted); cursor: progress; }
    button.quiet {
      border: 0; background: none; padding: 6px 0; color: var(--muted);
      text-decoration: underline; text-underline-offset: 3px;
    }
    button.quiet:hover { color: var(--bad); }

    .mono { font-family: var(--mono); font-size: 0.93em; letter-spacing: -0.01em; }
    .muted { color: var(--muted); }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/">github-bkp</a>
      <nav aria-label="Principal">
        <a href="/" {% if active == "repos" %}aria-current="page"{% endif %}>Repositórios</a>
        <a href="/runs" {% if active == "runs" %}aria-current="page"{% endif %}>Execuções</a>
        <a href="/arquitetura">Arquitetura</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
