<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>github-bkp</title>
  <!-- Tile in the signal-flow navy so the icon reads on light and dark browser tabs. -->
  <rect width="32" height="32" rx="8" fill="#030711"/>
  <!-- Shield: the backup. -->
  <path d="M16 3.5 26 7v8.2c0 6.3-4.2 11-10 13.3C10.2 26.2 6 21.5 6 15.2V7z"
        fill="#0b1b2e" stroke="#67e8f9" stroke-width="2" stroke-linejoin="round"/>
  <!-- Git branch inside: the history it keeps. Main line on the left, a branch merging in. -->
  <path d="M12.5 11v10M19.5 12.5v1c0 2.6-2.2 3.8-7 4.7" fill="none" stroke="#f5fbff"
        stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="12.5" cy="10.5" r="2.1" fill="#f5fbff"/>
  <circle cx="12.5" cy="21.5" r="2.1" fill="#f5fbff"/>
  <circle cx="19.5" cy="10.5" r="2.1" fill="#67e8f9"/>
</svg>
